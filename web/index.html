<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chem2Line WebEz Edition</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; display: flex; flex-direction: column; background-color: white; min-height: 100vh; }
        #header { width: 100%; text-align: center; padding: 10px; background-color: #f0f0f0; font-size: 20px; font-weight: bold; border-bottom: 1px solid #ddd; }
        #main { display: flex; flex-direction: row; flex-grow: 1; }
        #left-panel { width: 50%; display: flex; flex-direction: column; align-items: center; border-right: 1px solid #ddd; overflow-y: auto; }
        #right-panel { width: 50%; display: flex; flex-direction: column; align-items: center; padding: 10px; }
        #controls { margin: 10px; }
        #smiles-canvas { width: 100%; height: auto; border: 1px solid #ddd; background-color: white; }
        canvas { border: 1px solid #ddd; background-color: white; max-width: 100%; touch-action: none; }
        #joystick-row { display: flex; align-items: center; margin-top: 10px; flex-wrap: wrap; justify-content: center; gap: 10px; }
        #joystick-container, #camera-joystick-container {
            width: 100px; height: 100px; background: rgba(0, 0, 0, 0.1); border-radius: 50%;
            position: relative; touch-action: none;
        }
        #joystick, #camera-joystick {
            position: absolute; width: 40px; height: 40px; background: rgba(0, 0, 0, 0.5); border-radius: 50%; top: 30px; left: 30px;
        }
        #zoom-slider { margin: 0 10px; width: 150px; }
        #health-indicators {
            margin-top: 8px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 12px;
            font-size: 12px;
            color: #666;
        }
        .health-item { display: inline-flex; align-items: center; gap: 4px; }
        .health-light { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .light-red { background: #d93025; }
        .light-yellow { background: #f9ab00; }
        .light-green { background: #188038; }

        /* 输入区域优化 */
        #smiles_input { font-size: 16px; padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 6px 12px; border: 1px solid #ccc; border-radius: 4px; background: #f8f8f8; cursor: pointer; font-size: 14px; }
        button:active { background: #e0e0e0; }

        /* ─── 移动端响应式 ─── */
        @media screen and (max-width: 768px) {
            #header { font-size: 16px; padding: 8px; }
            #main { flex-direction: column; }
            #left-panel { width: 100%; border-right: none; border-bottom: 1px solid #ddd; }
            #right-panel { width: 100%; padding: 10px; }

            #left-panel > div { padding: 10px !important; }

            /* 输入框全宽 */
            #smiles_input { width: 100% !important; font-size: 16px; }

            /* 按钮换行 */
            #left-panel button { margin-top: 6px; }

            /* 画布自适应 */
            canvas#viewer { width: 100% !important; height: auto !important; aspect-ratio: 1; }

            /* 摇杆行 */
            #joystick-row { flex-wrap: wrap; gap: 12px; padding: 0 10px; }
            #joystick-container, #camera-joystick-container { width: 80px; height: 80px; }
            #joystick, #camera-joystick { width: 32px; height: 32px; top: 24px; left: 24px; }
            #zoom-slider { width: 100%; max-width: 200px; }

            /* SVG 图片自适应 */
            #drawing svg { width: 100% !important; height: auto !important; max-width: 100%; }

            /* 同分异构体列表 */
            #isomers > div { justify-content: center !important; }
            #isomers > div > div { width: 45% !important; min-width: 140px; }

            /* 选项区域紧凑 */
            #left-panel label { font-size: 13px; }
            #left-panel input[type="text"],
            #left-panel input[type="number"] { font-size: 14px; padding: 4px 6px; }

            /* 底部信息 */
            #desktop-version-info { font-size: 12px; }
        }

        /* 超小屏幕（<480px） */
        @media screen and (max-width: 480px) {
            #header { font-size: 14px; }
            #joystick-container, #camera-joystick-container { width: 70px; height: 70px; }
            #joystick, #camera-joystick { width: 28px; height: 28px; top: 21px; left: 21px; }
            button { font-size: 13px; padding: 5px 10px; }
        }
    </style>
</head>
<body>
    <div id="header">Chem2Line WebEz Edition</div>
    <div id="main">
        <div id="left-panel">
                        <div style="width:100%; padding:8px; box-sizing:border-box;">
                            <h2>分子显示</h2>
                            <div id="molecule">
                                <div id="drawing"></div>
                                <div id="can_smiles" style="margin-top:6px; color:#333;"></div>
                            </div>
                            <div style="margin-top:8px;">
                                输入：<input id="smiles_input" type="text" value="CCO" style="width:60%; min-width:120px;" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"> <button onclick="loadMolecule()">加载</button>
                                <button onclick="resetFrontendState()" style="margin-left:8px;">重置</button>
                                <input type="checkbox" id="forceSMILES" style="margin-left:8px;"> <label for="forceSMILES" style="font-size:12px;">强制SMILES</label>
                                <input type="checkbox" id="forceProxy" style="margin-left:8px;"> <label for="forceProxy" style="font-size:12px;">强制代理</label>
                            </div>
                            <div id="descrs" style="margin-top:8px;"></div>
                            <div id="canvas-div" style="margin-top:8px;">
                                <!-- 使用单一 SVG 显示（移除 canvas，避免重复显示） -->
                            </div>
                            <div style="margin-top:6px;">
                                <button onclick="copySVG()">复制 图片 (PNG)</button>
                                <button onclick="copySVGSource()" style="margin-left:8px;">复制 SVG 源</button>
                                <button onclick="openSVGTab()" style="margin-left:8px;">在新标签打开 SVG</button>
                                <button id="get-name-btn" onclick="fetchStandardName()" style="margin-left:8px;">获取标准命名（IUPAC）</button>
                            </div>
                            <div id="standard_name" style="margin-top:8px; color:#222;"></div>
                            <div id="isomers" style="margin-top:8px; color:#222;"></div>
                            <div style="margin-top:8px;">
                                <label for="canvasSizeInput">画布尺寸（px，正方形）</label>
                                <input id="canvasSizeInput" type="number" min="100" max="1600" step="10" style="margin-left:8px; width:100px;" />
                                <button onclick="applyCanvasSize()" style="margin-left:8px;">应用</button>
                            </div>

                            <div style="margin-top:8px;">
                                <input type="checkbox" id="addAtomIndices" onclick="option_changed(this);"> <label for="addAtomIndices">显示原子索引</label>
                                <input type="checkbox" id="addBondIndices" onclick="option_changed(this);" style="margin-left:12px;"> <label for="addBondIndices">显示键索引</label>
                                <input type="checkbox" id="addStereoAnnotation" onclick="option_changed(this);" style="margin-left:12px;"> <label for="addStereoAnnotation">显示立体注释</label>
                            </div>
                            <div style="margin-top:8px;">
                                <input type="checkbox" id="explicitMethyl" onclick="option_changed(this);"> <label for="explicitMethyl">显示显式氢</label>
                            </div>
                            <div style="margin-top:8px;">
                                <label for="legend">戳记</label>
                                <input type="text" id="legend" onkeyup="option_changed(this);" style="margin-left:8px; width:40%;">
                            </div>
                            <div style="margin-top:8px;">
                                <label for="legendFontSize">图例字体大小</label>
                                <input type="text" id="legendFontSize" onkeyup="option_changed(this);" style="margin-left:8px; width:80px;">
                                <label for="bondLineWidth" style="margin-left:12px;">键线宽度</label>
                                <input type="number" id="bondLineWidth" onkeyup="option_changed(this);" style="margin-left:8px; width:80px;">
                            </div>

                            <div style="margin-top:12px; border-top:1px solid #eee; padding-top:8px;">
                                <strong>缩写</strong><br>
                                <input type="checkbox" id="useAbbreviations" onclick="abbreviation_option_changed(this);"> <label for="useAbbreviations">使用缩写</label>
                                <input type="checkbox" id="useLinkers" onclick="abbreviation_option_changed(this);" style="margin-left:12px;"> <label for="useLinkers">使用连接片</label>
                                <label for="maxCoverage" style="margin-left:12px;">最大覆盖率</label>
                                <input type="text" id="maxCoverage" value="0.4" onclick="abbreviation_option_changed(this);" style="margin-left:6px; width:60px;">
                            </div>
                        </div>
            <div id="health-indicators">
                <div class="health-item" id="rdkit-health-item" title="RDKit 初始化状态">
                    <span class="health-light light-red" id="rdkit-light"></span>
                    <span id="rdkit-health-text">RDKit 未就绪</span>
                </div>
                <div class="health-item" id="webgl-health-item" title="WebGL 初始化状态">
                    <span class="health-light light-red" id="webgl-light"></span>
                    <span id="webgl-health-text">WebGL 未就绪</span>
                </div>
            </div>
            <div id="desktop-version-info" style="margin-top: 20px; text-align: center; font-size: 14px; color: gray;">
                <p>获取 <a href="https://github.com/Ziyang-Bai/Chem2Line" target="_blank" style="color: blue; text-decoration: none;">Chem2Line桌面版</a> 使用更完整的功能！</p>
                <p>开发者 <a href="https://Ziyang-Bai.com" target="_blank" style="color: blue; text-decoration: none;">Ziyang-Bai</a></p>
                <p>访问 <a href="https://github.com/Ziyang-Bai/Chem2Line" target="_blank" style="color: blue; text-decoration: none;">软件仓库</a> 保持领先！</p>
            </div>
        </div>
        <div id="right-panel">
            <canvas id="viewer"></canvas>
            <div id="joystick-row">
                <div id="joystick-container">
                    <div id="joystick"></div>
                </div>
                <input id="zoom-slider" type="range" min="1" max="50" value="20">
                <div id="camera-joystick-container">
                    <div id="camera-joystick"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="assets/three.min.js"></script>
    <script src="assets/RDKit_minimal.js"></script>
    <script>
        function setHealthStatus(target, state, text) {
            const light = document.getElementById(target + '-light');
            const label = document.getElementById(target + '-health-text');
            if (light) {
                light.classList.remove('light-red', 'light-yellow', 'light-green');
                if (state === 'green') light.classList.add('light-green');
                else if (state === 'yellow') light.classList.add('light-yellow');
                else light.classList.add('light-red');
            }
            if (label && text) label.innerText = text;
        }

        // Three.js 初始化
        const smilesImageDiv = document.getElementById("smiles-image");
        const canvas = document.getElementById("viewer");

        const DEFAULT_SMILES = '';
        const DEFAULT_CANVAS_SIZE = 400;
        // 画布尺寸（单一数值，正方形），从 localStorage 读取或使用默认值
        // 移动端自动适配容器宽度
        function getResponsiveCanvasSize() {
            const stored = parseInt(localStorage.getItem('chem2line_canvas_size'));
            if (stored && stored >= 100) return stored;
            // 移动端：使用右侧面板宽度（或视口宽度）
            const rightPanel = document.getElementById('right-panel');
            if (rightPanel && rightPanel.clientWidth > 0 && rightPanel.clientWidth < 500) {
                return Math.min(rightPanel.clientWidth - 20, 400);
            }
            return DEFAULT_CANVAS_SIZE;
        }
        let canvasSize = getResponsiveCanvasSize();
        // 将尺寸应用到 canvas
        canvas.style.width = canvas.style.height = canvasSize + 'px';
        canvas.width = canvasSize;
        canvas.height = canvasSize;

        let renderer = null;
        try {
            renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
            setHealthStatus('webgl', 'green', 'WebGL 正常');
        } catch (e) {
            setHealthStatus('webgl', 'yellow', 'WebGL 异常');
            console.warn('WebGL 初始化失败', e);
        }
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
        const light = new THREE.PointLight(0xffffff, 1.5);
        light.position.set(10, 10, 10);
        scene.add(light);

        const atomColors = {
            H: 0xffffff, C: 0x00ffff, N: 0x0000ff, O: 0xff0000, F: 0x00ff00,
            Cl: 0x00ff00, Br: 0x8b0000, I: 0x9400d3, S: 0xffff00, P: 0xffa500
        };
        const bondColor = 0x808080;

        let moleculeGroup = new THREE.Group();
        scene.add(moleculeGroup);
        camera.position.z = 20;

        // RDKit 初始化
        let RDKitModule = null;
        initRDKitModule({
            locateFile: () => "assets/RDKit_minimal.wasm"
        }).then(function (m) {
            RDKitModule = m;
            setHealthStatus('rdkit', 'green', 'RDKit 正常');
            console.log('RDKit ready', RDKitModule.version());
        }).catch(err => {
            setHealthStatus('rdkit', 'yellow', 'RDKit 异常');
            console.error(err);
        });

        // 渲染循环（不重复设置大小，大小由 applyCanvasSize 管理）
        function animate() {
            requestAnimationFrame(animate);
            if (renderer) renderer.render(scene, camera);
        }
        animate();

        // 应用并保存画布尺寸（单一正方形尺寸）
        function applyCanvasSize() {
            const input = document.getElementById('canvasSizeInput');
            if (!input) return;
            let v = parseInt(input.value);
            if (isNaN(v) || v < 100) v = 600;
            if (v > 1600) v = 1600;
            canvasSize = v;
            localStorage.setItem('chem2line_canvas_size', String(canvasSize));
            // apply to canvas and renderer
            canvas.style.width = canvas.style.height = canvasSize + 'px';
            canvas.width = canvasSize; canvas.height = canvasSize;
            if (renderer) renderer.setSize(canvasSize, canvasSize);
            // if SVG exists, reapply size wrapper
            if (window.__last_svg) setSVG(window.__last_svg);
        }

        function syncForceSmilesCheckbox() {
            const checkbox = document.getElementById('forceSMILES');
            if (checkbox) checkbox.checked = runtimeOptions.forceSMILES;
        }

        async function resetFrontendState() {
            const smilesInput = document.getElementById('smiles_input');
            const canvasInput = document.getElementById('canvasSizeInput');
            const drawing = document.getElementById('drawing');
            const canSmiles = document.getElementById('can_smiles');
            const descrs = document.getElementById('descrs');
            const standardName = document.getElementById('standard_name');
            const isomers = document.getElementById('isomers');

            runtimeOptions.forceProxy = false;
            runtimeOptions.debugMode = false;
            runtimeOptions.forceSMILES = false;

            localStorage.removeItem('chem2line_force_proxy');
            localStorage.removeItem('chem2line_debug_mode');
            localStorage.removeItem('chem2line_force_smiles');
            localStorage.removeItem('chem2line_canvas_size');

            if (smilesInput) smilesInput.value = DEFAULT_SMILES;
            if (canvasInput) canvasInput.value = String(DEFAULT_CANVAS_SIZE);
            canvasSize = DEFAULT_CANVAS_SIZE;
            syncForceSmilesCheckbox();

            if (drawing) drawing.innerHTML = '';
            if (canSmiles) canSmiles.innerHTML = '';
            if (descrs) descrs.innerHTML = '';
            if (standardName) standardName.innerHTML = '';
            if (isomers) isomers.innerHTML = '';
            window.__last_svg = '';
            currentCanonical = null;
            last3DData = null;
            moleculeGroup.clear();

            if (logPanelVisible) toggleLogPanel(false);
            try {
                await syncBackendDebugMode();
            } catch (e) {}

            applyCanvasSize();
            return getRuntimeStatus();
        }

        // 渲染分子（复用之前渲染逻辑）
        function renderMolecule(data) {
            moleculeGroup.clear();
            const { atoms, bonds } = data;
            atoms.forEach(atom => {
                const geometry = new THREE.SphereGeometry(atom.symbol === 'H' ? 0.3 : 0.5, 24, 24);
                const material = new THREE.MeshPhongMaterial({ color: atomColors[atom.symbol] || 0xff69b4 });
                const sphere = new THREE.Mesh(geometry, material);
                sphere.position.set(atom.x, atom.y, atom.z);
                moleculeGroup.add(sphere);
            });
            bonds.forEach(bond => {
                const start = bond.start, end = bond.end;
                const dir = new THREE.Vector3(bond.direction.x, bond.direction.y, bond.direction.z);
                const length = dir.length();
                const axis = dir.clone().normalize();
                const up = new THREE.Vector3(0, 1, 0);
                const quaternion = new THREE.Quaternion().setFromUnitVectors(up, axis);
                const center = new THREE.Vector3((start.x + end.x) / 2, (start.y + end.y) / 2, (start.z + end.z) / 2);
                const bondType = Math.round(bond.type || 1);
                if (bond.aromatic) {
                    const geom = new THREE.CylinderGeometry(0.05, 0.05, length, 12);
                    const mat = new THREE.MeshPhongMaterial({ color: 0xA0522D });
                    const m = new THREE.Mesh(geom, mat);
                    m.position.copy(center);
                    m.setRotationFromQuaternion(quaternion);
                    moleculeGroup.add(m);
                } else if (bondType > 1) {
                    let perp = new THREE.Vector3(dir.y, -dir.x, 0);
                    if (perp.length() < 1e-3) perp = new THREE.Vector3(0, dir.z, -dir.y);
                    perp.normalize().multiplyScalar(0.15);
                    for (let k = 0; k < bondType; k++) {
                        const offset = k - Math.floor((bondType - 1) / 2);
                        const geom = new THREE.CylinderGeometry(0.08, 0.08, length, 12);
                        const mat = new THREE.MeshPhongMaterial({ color: bondColor });
                        const m = new THREE.Mesh(geom, mat);
                        m.position.set(center.x + offset * perp.x, center.y + offset * perp.y, center.z + offset * perp.z);
                        m.setRotationFromQuaternion(quaternion);
                        moleculeGroup.add(m);
                    }
                } else {
                    const geom = new THREE.CylinderGeometry(0.12, 0.12, length, 12);
                    const mat = new THREE.MeshPhongMaterial({ color: bondColor });
                    const m = new THREE.Mesh(geom, mat);
                    m.position.copy(center);
                    m.setRotationFromQuaternion(quaternion);
                    moleculeGroup.add(m);
                }
            });
        }

        // 将 RDKit 生成的 SVG 放到左侧
        function setSVG(svgText) {
            // 强制把 svg 标记的尺寸设为 canvasSize x canvasSize
            try {
                let modified = svgText.replace(/<svg([^>]*)>/i, function(m, g1){
                    let attrs = g1 || '';
                    attrs = attrs.replace(/\swidth\s*=\s*"[^"]*"/ig, '');
                    attrs = attrs.replace(/\sheight\s*=\s*"[^"]*"/ig, '');
                    attrs = attrs.replace(/\sstyle\s*=\s*"[^"]*"/ig, '');
                    return '<svg' + attrs + ' width="' + canvasSize + '" height="' + canvasSize + '" style="width:' + canvasSize + 'px;height:' + canvasSize + 'px;">';
                });
                const drawing = document.getElementById('drawing');
                if (drawing) {
                    drawing.outerHTML = "<div id='drawing'>" + modified + "</div>";
                } else {
                    smilesImageDiv.innerHTML = modified;
                }
            } catch (e) {
                console.warn('setSVG failed to modify svg size', e);
                const drawing = document.getElementById('drawing');
                if (drawing) drawing.outerHTML = "<div id='drawing'>" + svgText + "</div>";
            }
        }

        // Helper: 从 PubChem property JSON 中提取可能的 SMILES 字段
        function extractSmilesFromProperty(propJson) {
            try {
                const p = propJson && propJson.PropertyTable && propJson.PropertyTable.Properties && propJson.PropertyTable.Properties[0];
                if (!p) return null;
                return p.IsomericSMILES || p.SMILES || p.SMILE || p.ConnectivitySMILES || p.Smiles || null;
            } catch (e) { return null; }
        }

        const PUBCHEM_PUG_BASE = 'https://pubchem.ncbi.nlm.nih.gov/rest/pug/';
        const runtimeOptions = {
            forceProxy: localStorage.getItem('chem2line_force_proxy') === '1',
            debugMode: localStorage.getItem('chem2line_debug_mode') === '1',
            forceSMILES: localStorage.getItem('chem2line_force_smiles') === '1'
        };

        function debugLog(...args) {
            if (!runtimeOptions.debugMode) return;
            console.debug('[Chem2Line Debug]', ...args);
        }

        async function syncBackendDebugMode() {
            try {
                const r = await fetch('/api/debug-mode', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ enabled: runtimeOptions.debugMode })
                });
                if (!r.ok) console.warn('同步后端调试模式失败，HTTP', r.status);
            } catch (e) {
                console.warn('同步后端调试模式失败:', e);
            }
        }

        function getRuntimeStatus() {
            return {
                forceProxy: runtimeOptions.forceProxy,
                debugMode: runtimeOptions.debugMode,
                forceSMILES: runtimeOptions.forceSMILES
            };
        }

        // 浏览器控制台命令：
        // chem2line('proxy on') / chem2line('proxy off')
        // chem2line('debug on') / chem2line('debug off')
        // chem2line('status') / chem2line('help')
        window.chem2line = async function(command) {
            const cmd = String(command || '').trim().toLowerCase();
            if (cmd === 'proxy on') {
                runtimeOptions.forceProxy = true;
                localStorage.setItem('chem2line_force_proxy', '1');
                console.info('已开启强制代理模式');
                return getRuntimeStatus();
            }
            if (cmd === 'proxy off') {
                runtimeOptions.forceProxy = false;
                localStorage.setItem('chem2line_force_proxy', '0');
                console.info('已关闭强制代理模式');
                return getRuntimeStatus();
            }
            if (cmd === 'debug on') {
                runtimeOptions.debugMode = true;
                localStorage.setItem('chem2line_debug_mode', '1');
                await syncBackendDebugMode();
                console.info('已开启调试模式');
                return getRuntimeStatus();
            }
            if (cmd === 'debug off') {
                runtimeOptions.debugMode = false;
                localStorage.setItem('chem2line_debug_mode', '0');
                await syncBackendDebugMode();
                console.info('已关闭调试模式');
                return getRuntimeStatus();
            }
            if (cmd === 'force-smiles on') {
                runtimeOptions.forceSMILES = true;
                localStorage.setItem('chem2line_force_smiles', '1');
                syncForceSmilesCheckbox();
                console.info('已开启强制SMILES模式');
                return getRuntimeStatus();
            }
            if (cmd === 'force-smiles off') {
                runtimeOptions.forceSMILES = false;
                localStorage.setItem('chem2line_force_smiles', '0');
                syncForceSmilesCheckbox();
                console.info('已关闭强制SMILES模式');
                return getRuntimeStatus();
            }
            if (cmd === 'status') {
                const s = getRuntimeStatus();
                console.info('当前状态:', s);
                return s;
            }
            console.info("可用命令: chem2line('proxy on|off'), chem2line('debug on|off'), chem2line('force-smiles on|off'), chem2line('status')");
            return getRuntimeStatus();
        };

        // 简短别名
        window.c2l = window.chem2line;

        let logPanelElement = null;
        let logPanelVisible = false;

        function createLogPanel() {
            if (logPanelElement) return;
            logPanelElement = document.createElement('div');
            logPanelElement.id = 'log-panel';

        async function pubchemFetchJSON(path, query = {}, timeout = 12) {
            const cleanPath = String(path || '').replace(/^\/+/, '');
            const qs = new URLSearchParams(query || {}).toString();
            const directUrl = PUBCHEM_PUG_BASE + cleanPath + (qs ? ('?' + qs) : '');
            let directError = null;

            if (!runtimeOptions.forceProxy) {
                try {
                    const directResp = await fetch(directUrl);
                    if (directResp.ok) {
                        const data = await directResp.json();
                        debugLog('PubChem 直连成功', { path: cleanPath, status: directResp.status });
                        return { ok: true, status: directResp.status, data, via: 'direct' };
                    }
                    directError = 'HTTP ' + directResp.status;
                    debugLog('PubChem 直连失败', { path: cleanPath, error: directError });
                } catch (e) {
                    directError = e && e.message ? e.message : String(e);
                    debugLog('PubChem 直连异常', { path: cleanPath, error: directError });
                }
            } else {
                directError = 'skipped(forceProxy=true)';
                debugLog('强制代理已开启，跳过直连', { path: cleanPath });
            }

            try {
                const proxyResp = await fetch('/api/pubchem/proxy', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path: cleanPath, query: query || {}, timeout: timeout })
                });
                let payload = null;
                try { payload = await proxyResp.json(); } catch (e) { payload = null; }

                if (proxyResp.ok && payload && payload.success && payload.data) {
                    debugLog('PubChem 代理成功', { path: cleanPath, status: payload.status || proxyResp.status });
                    return {
                        ok: true,
                        status: payload.status || proxyResp.status,
                        data: payload.data,
                        via: 'proxy',
                        directError: directError
                    };
                }

                const proxyErr = (payload && payload.error) ? payload.error : ('HTTP ' + proxyResp.status);
                debugLog('PubChem 代理失败', { path: cleanPath, error: proxyErr });
                return {
                    ok: false,
                    status: (payload && payload.status) ? payload.status : proxyResp.status,
                    error: 'direct=' + (directError || 'none') + '; proxy=' + proxyErr,
                    via: 'proxy'
                };
            } catch (e) {
                const proxyErr = e && e.message ? e.message : String(e);
                debugLog('PubChem 代理异常', { path: cleanPath, error: proxyErr });
                return {
                    ok: false,
                    status: 0,
                    error: 'direct=' + (directError || 'none') + '; proxy=' + proxyErr,
                    via: 'proxy'
                };
            }
        }

                // 从化学式获取 CID（支持 Waiting / ListKey 轮询）
                async function fetchCidsForFormula(formula, maxWaitSeconds = 20) {
                    try {
                        const first = await pubchemFetchJSON('compound/formula/' + encodeURIComponent(formula) + '/cids/JSON');
                        if (!first.ok) return null;
                        let j = first.data;
                        if (j && j.Waiting && j.ListKey) {
                            const listKey = j.ListKey;
                            const start = Date.now();
                            while ((Date.now() - start) / 1000 < maxWaitSeconds) {
                                await new Promise(res => setTimeout(res, 1000));
                                const poll = await pubchemFetchJSON('compound/listkey/' + encodeURIComponent(listKey) + '/cids/JSON');
                                if (!poll.ok) continue;
                                j = poll.data;
                                if (j && j.IdentifierList && j.IdentifierList.CID) return j.IdentifierList.CID;
                                if (j && j.Waiting) continue;
                            }
                            return null;
                        }
                        return j?.IdentifierList?.CID || null;
                    } catch (e) { return null; }
                }

                // 批量从 CID 列表获取 SMILES（返回 [{cid, smiles}]）
                async function fetchSmilesForCids(cids, batchSize = 50) {
                    const out = [];
                    try {
                        for (let i = 0; i < cids.length; i += batchSize) {
                            const chunk = cids.slice(i, i + batchSize);
                            try {
                                const r = await pubchemFetchJSON('compound/cid/' + chunk.join(',') + '/property/IsomericSMILES,SMILES,ConnectivitySMILES/JSON');
                                if (!r.ok) continue;
                                const j = r.data;
                                const props = j?.PropertyTable?.Properties || [];
                                for (const p of props) {
                                    const cid = p.CID;
                                    const smi = p.IsomericSMILES || p.SMILES || p.ConnectivitySMILES || p.Smiles || null;
                                    if (smi) out.push({ cid: cid, smiles: smi, prop: p });
                                }
                            } catch (e) { continue; }
                        }
                    } catch (e) { }
                    return out;
                }

                // 处理 CID 列表：若只有 1 个 SMILES 直接加载；若多个则展示同分异构体供用户选择
                async function handleCidsList(cids, sourceLabel) {
                    if (!cids || !cids.length) return false;
                    const maxShow = 12;
                    const sample = cids.slice(0, Math.min(cids.length, 100));
                    const isomers = await fetchSmilesForCids(sample, 50);
                    if (!isomers || isomers.length === 0) return false;
                    // 若只有一项，直接加载

                        if (inputEl) inputEl.value = smi;
                        if (status) status.innerText = '从 PubChem（' + sourceLabel + '）获取到 SMILES';
                        callback(smi, true);
                        return true;
                    }
                    // 多个：展示
                    displayIsomers(isomers.slice(0, Math.min(isomers.length, maxShow)));
                    return true;
                }

        function copySVG() {
            const svg = window.__last_svg || document.getElementById('drawing')?.innerHTML || '';
            if (!svg) return alert('没有可复制的 SVG');

            // 渲染为 PNG，并只将 PNG 写入剪贴板以避免多 ClipboardItem 限制
            try {
                const svgBlob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
                const url = URL.createObjectURL(svgBlob);
                const img = new Image();
                img.onload = async function () {
                    try {
                        const canvas = document.createElement('canvas');
                        canvas.width = img.naturalWidth || img.width || 800;
                        canvas.height = img.naturalHeight || img.height || 600;
                        const ctx = canvas.getContext('2d');
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        ctx.drawImage(img, 0, 0);

                        canvas.toBlob(async function (blob) {
                            try {
                                if (window.navigator.clipboard && window.ClipboardItem) {
                                    // 仅写入 PNG
                                    if (blob) {
                                        const item = new ClipboardItem({ 'image/png': blob });
                                        await navigator.clipboard.write([item]);
                                        alert('图片已复制到剪贴板（PNG）');
                                    } else {
                                        alert('生成 PNG 失败');
                                    }
                                } else {
                                    const pngUrl = URL.createObjectURL(blob);
                                    window.open(pngUrl, '_blank');
                                    alert('浏览器不支持直接复制图片，已在新标签打开 PNG，右键复制或保存。');
                                }
                            } catch (e) {
                                alert('复制图片失败: ' + e);
                            } finally {
                                URL.revokeObjectURL(url);
                            }
                        }, 'image/png');
                    } catch (e) {
                        URL.revokeObjectURL(url);
                        alert('处理 SVG 失败: ' + e);
                    }
                };
                img.onerror = function (e) {
                    URL.revokeObjectURL(url);
                    alert('SVG 转图片加载失败');
                };
                img.src = url;
            } catch (e) {
                alert('复制失败: ' + e);
            }
        }

        // 获取标准命名（IUPAC）——前端直接查询 PubChem（优先使用 InChIKey）
        async function fetchStandardName() {
            const display = document.getElementById('standard_name');
            display.innerText = '查询中...';
            let smi = (document.getElementById('can_smiles') && document.getElementById('can_smiles').innerText) || document.getElementById('smiles_input').value || '';
            if (!smi) { display.innerText = '请输入 SMILES 后重试'; return; }
            if (!RDKitModule) { display.innerText = 'RDKit 未就绪，请等待'; return; }

            try {
                const mol = RDKitModule.get_mol(smi);
                let inchikey = null;
                try { if (typeof mol.get_inchi_key === 'function') inchikey = mol.get_inchi_key(); } catch (e) { inchikey = null; }

                async function fetchPubChemByInchiKey(key) {
                    try {
                        const p = await pubchemFetchJSON('compound/inchikey/' + encodeURIComponent(key) + '/property/IUPACName/JSON');
                        if (p.ok) {
                            const j = p.data;
                            const name = j && j.PropertyTable && j.PropertyTable.Properties && j.PropertyTable.Properties[0] && j.PropertyTable.Properties[0].IUPACName;
                            if (name) return { success: true, name, source: 'pubchem_inchikey' };
                        }
                        const s = await pubchemFetchJSON('compound/inchikey/' + encodeURIComponent(key) + '/synonyms/JSON');
                        if (s.ok) {
                            const j2 = s.data;
                            const syns = j2 && j2.InformationList && j2.InformationList.Information && j2.InformationList.Information[0] && j2.InformationList.Information[0].Synonym || [];
                            if (syns && syns.length) return { success: true, name: syns[0], synonyms: syns, source: 'pubchem_inchikey_synonyms' };
                        }
                    } catch (e) { }
                    return { success: false };
                }

                async function fetchPubChemBySmiles(smiles) {
                    try {
                        const es = encodeURIComponent(smiles);
                        const p = await pubchemFetchJSON('compound/smiles/' + es + '/property/IUPACName/JSON');
                        if (p.ok) {
                            const j = p.data;
                            const name = j && j.PropertyTable && j.PropertyTable.Properties && j.PropertyTable.Properties[0] && j.PropertyTable.Properties[0].IUPACName;
                            if (name) return { success: true, name, source: 'pubchem_smiles' };
                        }
                        const s = await pubchemFetchJSON('compound/smiles/' + es + '/synonyms/JSON');
                        if (s.ok) {
                            const j2 = s.data;
                            const syns = j2 && j2.InformationList && j2.InformationList.Information && j2.InformationList.Information[0] && j2.InformationList.Information[0].Synonym || [];
                            if (syns && syns.length) return { success: true, name: syns[0], synonyms: syns, source: 'pubchem_smiles_synonyms' };
                        }
                    } catch (e) { }
                    return { success: false };
                }

                let result = { success: false };
                if (inchikey) result = await fetchPubChemByInchiKey(inchikey);
                if (!result.success) {
                    let can = smi;
                    try { if (typeof mol.get_smiles === 'function') can = mol.get_smiles(); } catch (e) {}
                    result = await fetchPubChemBySmiles(can);
                }

                if (result.success) {
                    let txt = 'IUPAC 名称：' + (result.name || '') + '\n来源：' + (result.source || 'pubchem') + '\n';
                    if (result.synonyms && result.synonyms.length) txt += '详情：' + result.synonyms.slice(0,5).join(', ');
                    display.innerText = txt;
                } else {
                    let fallback = '';
                    if (inchikey) fallback = inchikey; else { try { fallback = mol.get_smiles(); } catch (e) { fallback = smi; } }
                    display.innerText = '未查询到 IUPAC 名称，回退标识：' + fallback;
                }

                try { mol.delete(); } catch (e) {}
            } catch (e) {
                display.innerText = '查询异常: ' + e;
            }
        }

        async function callback(text, update_descrs) {

            try {

                if (!!mol) {
                    draw(mol);
                    var ob = document.getElementById("can_smiles");

                        } catch (e) {
                            console.warn('descrs not available', e);
                        }
                    }
                    // store canonical and request 3D
                    try { currentCanonical = mol.get_smiles(); } catch(e) { currentCanonical = text; }
                    try { mol.delete(); } catch (e) {}

                    // call backend for 3D
                    try {
                        const resp = await fetch('/api/3d', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ smiles: currentCanonical }) });
                        if (resp.ok) {

            } catch (e) {

            }
        }

        // 主入口：加载分子（前端生成 2D + 调后端生成 3D）
        async function loadMolecule() {
            const inputEl = document.getElementById('smiles_input');
            const s = inputEl ? inputEl.value.trim() : '';
            if (!s) return alert('请输入 SMILES 或化学名称');
            const debugSteps = [];

            const status = document.getElementById('standard_name');
            if (status) status.innerText = '解析中...';

            // 先尝试用 RDKit 解释为 SMILES
            try {
                if (RDKitModule) {
                    try {
                        const testMol = RDKitModule.get_mol(s);
                        if (testMol) {
                            // 可以被识别为分子
                            try { const can = testMol.get_smiles(); if (inputEl) inputEl.value = can; } catch (e) {}
                            try { testMol.delete(); } catch (e) {}
                            if (status) status.innerText = '使用本地解析的 SMILES';
                            callback(s, true);
                            return;
                        }
                    } catch (e) {
                        debugSteps.push('RDKit 解析失败：' + (e && e.message ? e.message : String(e)));
                    }
                }
            } catch (e) { /* ignore */ }

            // 如果启用了强制SMILES，RDKit无法解析就直接抛错，不查PubChem
            if (runtimeOptions.forceSMILES) {
                if (status) status.innerText = '强制SMILES模式：无法解析输入';
                alert('强制SMILES模式下，输入无法被解析为有效SMILES。\n\n输入内容：' + s + '\n\n请确保输入是标准SMILES格式。');
                return;
            }

                // 如果 RDKit 无法解析，认为是名称或化学式，去 PubChem 查找 SMILES
            try {
                const name = encodeURIComponent(s);
                const r = await pubchemFetchJSON('compound/name/' + name + '/property/IsomericSMILES,SMILES,ConnectivitySMILES/JSON');
                if (!r.ok) {
                    debugSteps.push('PubChem 名称属性查询失败：' + (r.error || ('HTTP ' + r.status)));
                    // 试试 synonyms /CID -> property
                    // 尝试直接通过 name->cids再取property
                    const rc = await pubchemFetchJSON('compound/name/' + name + '/cids/JSON');
                    if (rc.ok) {
                        const jc = rc.data;
                        const cids = jc?.IdentifierList?.CID || [];
                        if (cids.length) {
                            const handled = await handleCidsList(cids, 'name->cids');
                            if (handled) return;
                            debugSteps.push('name->cids 查询到 CID 但未获得可用 SMILES');
                        } else {
                            debugSteps.push('name->cids 未返回 CID');
                        }
                    } else {
                        debugSteps.push('PubChem 名称 CID 查询失败：' + (rc.error || ('HTTP ' + rc.status)));
                    }
                    // 如果名称查询失败，也可能输入的是化学式（例如 C6H12），尝试按 formula / fastformula 查询
                    try {
                        const formula = encodeURIComponent(s);
                        // 首先尝试 fastformula（更快的结构搜索）
                        const frFast = await pubchemFetchJSON('compound/fastformula/' + formula + '/cids/JSON', { MaxRecords: 20 });
                        if (frFast.ok) {
                            const fj = frFast.data;
                            const cids = fj?.IdentifierList?.CID || [];
                            const handled = await handleCidsList(cids, 'fastformula');
                            if (handled) return;
                            if (cids.length) debugSteps.push('fastformula 查询到 CID 但未获得可用 SMILES');
                            else debugSteps.push('fastformula 未返回 CID');
                        } else {
                            debugSteps.push('fastformula 查询失败：' + (frFast.error || ('HTTP ' + frFast.status)));
                        }
                        // 如果 fastformula 未命中，再尝试标准 formula 接口
                        const fr = await pubchemFetchJSON('compound/formula/' + formula + '/cids/JSON');
                        if (fr.ok) {
                            const fj = fr.data;
                            const cids = fj?.IdentifierList?.CID || [];
                            const handled = await handleCidsList(cids, 'formula');
                            if (handled) return;
                            if (cids.length) debugSteps.push('formula 查询到 CID 但未获得可用 SMILES');
                            else debugSteps.push('formula 未返回 CID');
                        } else {
                            debugSteps.push('formula 查询失败：' + (fr.error || ('HTTP ' + fr.status)));
                        }
                    } catch (fe) {
                        debugSteps.push('formula 回退查询异常：' + (fe && fe.message ? fe.message : String(fe)));
                    }

                    throw new Error('PubChem 未返回 SMILES (name search failed, and formula fallbacks failed)');
                }
                const j = r.data;
                const smi = extractSmilesFromProperty(j);
                if (smi) {
                    if (inputEl) inputEl.value = smi;
                    if (status) status.innerText = '从 PubChem 获取到 SMILES';
                    callback(smi, true);
                    return;
                }
                throw new Error('PubChem 未返回 SMILES');
            } catch (e) {
                // 如果按名称/直接查找失败，尝试按化学式（formula）查询 PubChem
                try {
                    const formula = encodeURIComponent(s);
                    const fr = await pubchemFetchJSON('compound/formula/' + formula + '/cids/JSON');
                    if (fr.ok) {
                        const fj = fr.data;
                        const cids = fj?.IdentifierList?.CID || [];
                        const handled = await handleCidsList(cids, 'formula');
                        if (handled) return;
                        if (cids.length) debugSteps.push('最终 formula 回退查询到 CID 但未获得可用 SMILES');
                        else debugSteps.push('最终 formula 回退未返回 CID');
                    } else {
                        debugSteps.push('最终 formula 回退失败：' + (fr.error || ('HTTP ' + fr.status)));
                    }
                } catch (ee) {
                    debugSteps.push('最终 formula 回退异常：' + (ee && ee.message ? ee.message : String(ee)));
                }

                if (status) status.innerText = '未能解析为 SMILES：' + e;
                const errText = e && e.message ? e.message : String(e);
                const details = [
                    '解析失败：未能将输入转换为有效 SMILES。',
                    '',
                    '输入内容：' + s,
                    '',
                    '已执行步骤：',
                    '1) 本地 RDKit 解析',
                    '2) PubChem 名称属性查询',
                    '3) PubChem 名称 -> CID 查询',
                    '4) PubChem fastformula/formula 回退查询',
                    '',
                    '失败详情：'
                ];
                if (debugSteps.length) {
                    debugSteps.forEach((item, idx) => details.push((idx + 1) + '. ' + item));
                } else {
                    details.push('1. 未捕获到额外诊断信息');
                }
                details.push('');
                details.push('最终错误：' + errText);
                details.push('');
                details.push('建议：');
                details.push('1) 确认输入拼写，或直接输入标准 SMILES（例如 CCO）');
                details.push('2) 若输入的是化学式（例如 C6H12O6），请检查大小写和数字');
                details.push('3) 若网络不稳定或 PubChem 暂时不可用，请稍后重试');
                alert(details.join('\n'));
            }
        }

        // 摇杆与缩放支持：使用旧模板的完整 joystick 实现（触摸 + 鼠标 + 防滚动）
        // Variables for joystick and zoom
        const joystickContainer = document.getElementById("joystick-container");
        const joystick = document.getElementById("joystick");
        const cameraJoystickContainer = document.getElementById("camera-joystick-container");
        const cameraJoystick = document.getElementById("camera-joystick");
        const zoomSlider = document.getElementById("zoom-slider");

        // Joystick setup function (from olds template)
        function setupJoystick(container, joystickEl, callback) {
            let active = false;
            let start = { x: 0, y: 0 };
            let touchId = null;

            // Mouse events
            container.addEventListener("mousedown", (event) => {
                event.preventDefault(); // 阻止页面滚动
                active = true;
                start = { x: event.clientX, y: event.clientY };
            });

            container.addEventListener("mousemove", (event) => {
                if (!active) return;
                event.preventDefault(); // 阻止页面滚动
                handleMove(event.clientX, event.clientY);
            });

            container.addEventListener("mouseup", (event) => {
                event.preventDefault(); // 阻止页面滚动
                active = false;
                resetJoystick();
            });

            container.addEventListener("mouseleave", (event) => {
                if (active) {
                    event.preventDefault(); // 阻止页面滚动
                    active = false;
                    resetJoystick();
                }
            });

            // Touch events
            container.addEventListener("touchstart", (event) => {
                if (event.touches.length > 1) return; // Ignore multi-touch
                event.preventDefault(); // 阻止页面滚动
                active = true;
                touchId = event.touches[0].identifier;
                start = {
                    x: event.touches[0].clientX,
                    y: event.touches[0].clientY
                };
            });

            container.addEventListener("touchmove", (event) => {
                if (!active) return;
                event.preventDefault(); // 阻止页面滚动

                // Find the correct touch point
                const touch = Array.from(event.touches).find(t => t.identifier === touchId);
                if (!touch) return;

                handleMove(touch.clientX, touch.clientY);
            });

            container.addEventListener("touchend", (event) => {
                const touch = Array.from(event.changedTouches).find(t => t.identifier === touchId);
                if (!touch) return;

                event.preventDefault(); // 阻止页面滚动
                active = false;
                resetJoystick();
            });

            function handleMove(clientX, clientY) {
                const deltaX = clientX - start.x;
                const deltaY = clientY - start.y;

                const maxDistance = 30;
                const distance = Math.min(maxDistance, Math.sqrt(deltaX ** 2 + deltaY ** 2));
                const angle = Math.atan2(deltaY, deltaX);

                joystickEl.style.transform = `translate(${distance * Math.cos(angle)}px, ${distance * Math.sin(angle)}px`;

                // Call the callback with normalized values (-1 to 1)
                const normalizedX = deltaX / maxDistance;
                const normalizedY = deltaY / maxDistance;
                callback(normalizedX, normalizedY);
            }

            function resetJoystick() {
                joystickEl.style.transform = "translate(0, 0)";
                callback(0, 0);
            }
        }

        // Initialize joysticks using olds implementation
        setupJoystick(joystickContainer, joystick, (x, y) => {
            moleculeGroup.rotation.y += x * 0.05;
            moleculeGroup.rotation.x += y * 0.05;
        });

        setupJoystick(cameraJoystickContainer, cameraJoystick, (x, y) => {
            camera.position.x += x * 0.5;
            camera.position.y -= y * 0.5;
        });

        // Zoom slider logic
        zoomSlider.addEventListener("input", (event) => {
            camera.position.z = event.target.value;
        });

        // Add touch support for zoom slider
        zoomSlider.addEventListener("touchmove", (event) => {
            camera.position.z = event.target.value;
        });

        // ─── 3D Canvas 触摸手势支持（移动端） ───
        (function() {
            let touchStartX = 0, touchStartY = 0;
            let lastPinchDist = 0;
            let isSingleTouch = false;

            canvas.addEventListener('touchstart', function(e) {
                if (e.touches.length === 1) {
                    isSingleTouch = true;
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                } else if (e.touches.length === 2) {
                    isSingleTouch = false;
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    lastPinchDist = Math.sqrt(dx * dx + dy * dy);
                }
                e.preventDefault();
            }, { passive: false });

            canvas.addEventListener('touchmove', function(e) {
                if (e.touches.length === 1 && isSingleTouch) {
                    // 单指拖动 = 旋转
                    const dx = e.touches[0].clientX - touchStartX;
                    const dy = e.touches[0].clientY - touchStartY;
                    moleculeGroup.rotation.y += dx * 0.01;
                    moleculeGroup.rotation.x += dy * 0.01;
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                } else if (e.touches.length === 2) {
                    // 双指缩放
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (lastPinchDist > 0) {
                        const scale = dist / lastPinchDist;
                        camera.position.z = Math.max(1, Math.min(50, camera.position.z / scale));
                        zoomSlider.value = Math.round(camera.position.z);
                    }
                    lastPinchDist = dist;
                }
                e.preventDefault();
            }, { passive: false });

            canvas.addEventListener('touchend', function(e) {
                if (e.touches.length === 0) {
                    isSingleTouch = false;
                    lastPinchDist = 0;
                }
            });
        })();

        // ─── 窗口大小变化时自适应 canvas ───
        window.addEventListener('resize', function() {
            if (window.innerWidth <= 768) {
                const rightPanel = document.getElementById('right-panel');
                if (rightPanel && rightPanel.clientWidth > 0) {
                    const newSize = Math.min(rightPanel.clientWidth - 20, 500);
                    canvas.style.width = newSize + 'px';
                    canvas.style.height = newSize + 'px';
                    canvas.width = newSize;
                    canvas.height = newSize;
                    if (renderer) renderer.setSize(newSize, newSize);
                }
            }
        });

        // 启动时设置输入初始值并应用持久化的画布尺寸
        window.addEventListener('load', ()=>{
            const inp = document.getElementById('canvasSizeInput');
            if (inp) inp.value = canvasSize;
            try { renderer.setSize(canvasSize, canvasSize); } catch(e){}
            if (runtimeOptions.debugMode) syncBackendDebugMode();

            // 移动端自适应 canvas
            if (window.innerWidth <= 768) {
                const rightPanel = document.getElementById('right-panel');
                if (rightPanel && rightPanel.clientWidth > 0) {
                    const mobileSize = Math.min(rightPanel.clientWidth - 20, 400);
                    canvas.style.width = mobileSize + 'px';
                    canvas.style.height = mobileSize + 'px';
                    canvas.width = mobileSize;
                    canvas.height = mobileSize;
                    if (renderer) renderer.setSize(mobileSize, mobileSize);
                    canvasSize = mobileSize;
                    if (inp) inp.value = mobileSize;
                }
            }

            // 初始化强制SMILES复选框
            const forceSMILESCheckbox = document.getElementById('forceSMILES');
            if (forceSMILESCheckbox) {
                forceSMILESCheckbox.checked = runtimeOptions.forceSMILES;
                forceSMILESCheckbox.addEventListener('change', (e) => {
                    runtimeOptions.forceSMILES = e.target.checked;
                    localStorage.setItem('chem2line_force_smiles', e.target.checked ? '1' : '0');
                });
            }

            // 初始化强制代理复选框
            const forceProxyCheckbox = document.getElementById('forceProxy');
            if (forceProxyCheckbox) {
                forceProxyCheckbox.checked = runtimeOptions.forceProxy;
                forceProxyCheckbox.addEventListener('change', (e) => {
                    runtimeOptions.forceProxy = e.target.checked;
                    localStorage.setItem('chem2line_force_proxy', e.target.checked ? '1' : '0');
                });
            }

            if (RDKitModule){};
        });
    </script>
</body>
